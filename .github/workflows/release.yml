name: Build and Release Plugin

on:
  push:
    branches:
      - master
    paths:
      - 'manifest.json'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Get version from manifest
        id: get-version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Package plugin files into ZIP
        id: package
        run: |
          PLUGIN_ID=$(node -p "require('./manifest.json').id")
          ZIP_NAME="${PLUGIN_ID}-${{ steps.get-version.outputs.version }}.zip"
          mkdir -p "${PLUGIN_ID}"
          cp main.js manifest.json styles.css "${PLUGIN_ID}/"
          zip -r "${ZIP_NAME}" "${PLUGIN_ID}"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "Created package: ${ZIP_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-version.outputs.version }}
          name: Release v${{ steps.get-version.outputs.version }}
          files: |
            main.js
            manifest.json
            styles.css
            ${{ steps.package.outputs.zip_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
